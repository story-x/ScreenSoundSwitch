name: Build ScreenSoundSwitch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 拉取源码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 锁定 .NET 8 SDK（避免默认升级到 .NET 10 导致 v18.0 路径丢失）
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. 启用 Visual Studio 的完整 MSBuild（解决 WinUI 3 的 PRI 与 AppX 打包依赖）
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 4. 还原整个解决方案依赖
      - name: Restore Dependencies
        run: dotnet restore ScreenSoundSwitch.sln

      # 5. 使用 MSBuild 独立发布 WinUI 主工程
      - name: Build and Publish WinUI
        run: |
          msbuild ScreenSoundSwitch.WinUI\ScreenSoundSwitch.WinUI.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir=..\publish

      # 6. 打包上传生成文件
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSoundSwitch-WinUI3-x64
          path: publish
